
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
      background: #f4f7fc;
      text-align: center;
    }
    h2 { color: #2563eb; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Session Verification</h2>
  <p>To continue, you must verify your session.</p>

  <button onclick="document.getElementById('result').textContent =
    'DEMONSTRATION: External JavaScript executed inside the iframe.'">
    Verify Session
  </button>

  <p id="result"></p>

  <button onclick="window.top.location.href='https://example.com/'">
    Test Navigation Outside Iframe
  </button>
</body>
</html>
