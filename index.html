<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>SalarFusion Security Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    padding: 25px;
    text-align: center;
  }
button {
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 12px 20px;
  cursor: pointer;
}
  }
  input {
    padding: 10px;
    margin: 8px;
  }
</style>
</head>
<body>
  <h2>SalarFusion - Sessiecontrole</h2>
  <p>Demonstratie: een externe website kan
     invoervelden tonen binnen SalarFusion.</p>

  <input placeholder="Fictieve gebruikersnaam"
         autocomplete="off">
  <button onclick="document.getElementById('result').textContent =
    'DEMONSTRATIE: externe inhoud verwerkt invoer binnen het iframe.'">
    Sessie bevestigen
  </button>

  <p id="result"></p>

  Voeg onderstaande code toe onder de bestaande knop in je GitHub-bestand index.html.

<div style="margin-top: 20px;">
  <button
    style="background: #dc2626; color: white; padding: 12px; border: none; border-radius: 6px;"
    onclick="testParentAccess()">
    Test toegang tot SalarFusion
  </button>

  <p id="securityResult"></p>
</div>

<script>
function testParentAccess() {
  const result = document.getElementById("securityResult");

  try {
    const title = window.parent.document.title;

    result.textContent =
      "TOEGANG MOGELIJK! Titel bovenliggende pagina: " + title;
    result.style.color = "red";

  } catch (error) {
    result.textContent =
      "TOEGANG GEBLOKKEERD: " + error.name;
    result.style.color = "green";
  }
}
</script>
